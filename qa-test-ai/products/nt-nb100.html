<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NT-NB100 卓上ネブライザー</title>
</head>
<body>

  <h2>NT-NB100 卓上ネブライザー</h2>

  <p>
    家庭・診療所向けのコンプレッサー式ネブライザーです。
  </p>

  <h4>主な特徴</h4>
  <ul>
    <li>コンプレッサー式、安定した出力</li>
    <li>静音設計（動作音 ≤55dB）</li>
    <li>取り外し可能なチャンバー（洗浄しやすい）</li>
  </ul>

  <h4>仕様</h4>
  <table border="1">
    <thead>
      <tr>
        <th>項目</th>
        <th>内容</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>出力</td>
        <td>0.3mL/min</td>
      </tr>
      <tr>
        <td>粒子径</td>
        <td>MMAD 約3μm</td>
      </tr>
      <tr>
        <td>電源</td>
        <td>AC100V、50/60Hz</td>
      </tr>
      <tr>
        <td>寸法</td>
        <td>W180 × D140 × H140mm</td>
      </tr>
      <tr>
        <td>重量</td>
        <td>1.6kg</td>
      </tr>
    </tbody>
  </table>

  <h4>関連消耗品</h4>
  <ul>
    <li>ネブライザー用マスク（NT-NB100-MK）：大人用</li>
    <li>ネブライザー用チャンバー（NT-NB100-CH）：標準容量</li>
  </ul>

</body>
</html>
